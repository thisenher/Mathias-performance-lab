<style>
:root{--bg:#f3f2ef;--card:rgba(255,255,255,.88);--text:#161616;--muted:#77736c;--line:rgba(30,28,24,.09);--accent:#171717;--shadow:0 10px 35px rgba(24,22,18,.045)}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% -120px,#fff 0,#f7f6f3 34%,var(--bg) 72%);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
main{width:min(680px,100%);margin:auto;padding:42px 18px 64px}
header{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px;padding:0 2px}
.eyebrow{font-size:11px;font-weight:750;letter-spacing:.16em;text-transform:uppercase;color:#8c877f}
h1{font-size:32px;line-height:1.02;margin:9px 0 0;letter-spacing:-.045em;font-weight:760}
.total{font-size:12px;color:var(--muted);margin-top:10px;letter-spacing:.01em}.total strong{color:var(--text);font-weight:750}.week{font-size:13px;color:var(--muted);min-width:58px;text-align:center}.weeknav{display:flex;align-items:center;gap:7px;padding-bottom:1px}.weeknav button{width:34px;height:34px;border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:11px;font-size:21px;line-height:1;color:var(--text);cursor:pointer;box-shadow:0 4px 15px rgba(24,22,18,.035);backdrop-filter:blur(8px);transition:transform .15s ease,background .15s ease}.weeknav button:hover{background:#fff}.weeknav .refresh{margin-right:3px;font-size:18px}.weeknav button:active{transform:scale(.96)}
.days{display:grid;gap:11px}
.day{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 19px;display:grid;grid-template-columns:82px 1fr;gap:14px;min-height:80px;box-shadow:var(--shadow);backdrop-filter:blur(10px);transition:transform .15s ease,box-shadow .15s ease}
.day.today{border:1px solid rgba(20,20,20,.32);padding:18px 19px;box-shadow:0 12px 38px rgba(24,22,18,.08),inset 3px 0 0 #171717}
.date{font-size:11px;color:#99948d;margin-top:5px}.name{font-size:12px;font-weight:780;letter-spacing:.09em;text-transform:uppercase}
.session{font-size:18px;font-weight:730;letter-spacing:-.025em}.detail{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}.intensityPreview{font-size:11px;color:#918c84;margin-top:5px;line-height:1.4}
.rest .session{color:#9a9a96;font-weight:600}
.day.hasinfo{cursor:pointer}.expand{grid-column:2;margin-top:-2px;max-height:0;overflow:hidden;opacity:0;transition:max-height .25s ease,opacity .2s ease,margin .2s ease}.day.open .expand{max-height:260px;opacity:1;margin-top:10px}.focus{font-size:13px;line-height:1.55;color:var(--muted);padding-top:11px;border-top:1px solid var(--line)}.focus strong{color:var(--text)}.intensity{display:inline-flex;margin:0 0 11px;padding:6px 9px;border-radius:9px;background:rgba(24,22,18,.045);font-size:11px;font-weight:700;color:#5f5b55;letter-spacing:.01em}.moveRow{display:flex;align-items:center;gap:8px;margin-top:12px}.moveLabel{font-size:11px;color:#99948d}.moveSelect{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;font:inherit;font-size:12px;color:var(--text)}
.badge{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:#171717;color:white;border-radius:99px;padding:4px 8px;margin-left:7px;vertical-align:2px}
footer{font-size:11px;color:#aaa59e;margin-top:26px;text-align:center;letter-spacing:.02em}
@media(max-width:430px){main{padding:30px 14px 48px}h1{font-size:29px}.day{grid-template-columns:72px 1fr;padding:16px}.day.today{padding:16px}.session{font-size:17px}}
</style>
</head>
<body>
<main>
<header><div><div class="eyebrow">Mathias · Løbeplan</div><h1 id="heading">Denne uge</h1><div class="total" id="total"></div></div><div class="weeknav"><button id="refresh" class="refresh" aria-label="Opdater siden" title="Opdater">↻</button><button id="prev" aria-label="Forrige uge">‹</button><div class="week" id="week"></div><button id="next" aria-label="Næste uge">›</button></div></header>

   {d:2,s:"TANGES",x:"Ca. 18 km samlet",km:18,intensity:"Ugens primære kvalitetspas",focus:"Det konkrete Tanges-program opdateres, når det er kendt."},
   {d:3,s:"Hvile",x:"",rest:true,km:0},

   {d:6,s:"Langtur",x:"15 km · Roligt",km:15,intensity:"Puls · Z2 · RPE 2–3",focus:"Durability uden tempoarbejde. Stabil, rolig indsats fra første til sidste kilometer."},
   {d:0,s:"Hvile",x:"",rest:true,km:0}
  ],

   {d:0,s:"Hvile",x:"",rest:true,km:0}
  ],
  45:[
   {d:1,s:"Easy",x:"8 km",km:8,intensity:"Puls · Z2 · RPE 2–3",focus:"Tilbage til normal volumen efter absorptionsugen."},
   {d:2,s:"TANGES",x:"Ca. 18 km samlet",km:18,intensity:"Ugens primære kvalitetspas",focus:"Det konkrete Tanges-program opdateres, når det er kendt."},
   {d:3,s:"Hvile",x:"",rest:true,km:0},
   {d:4,s:"Easy + strides",x:"10 km · 6 × 20 sek.",km:10,intensity:"Z2 · RPE 2–3 · strides på følelse",focus:"Solid aerob tur med afslappede strides. Målet er volumen plus neuromuskulær fart uden et ekstra hårdt pas."},

  ],
  46:[
   {d:1,s:"Easy",x:"8 km",km:8,intensity:"Puls · Z2 · RPE 2–3",focus:"Kontrolleret aerob volumen før Tanges."},
   {d:2,s:"TANGES",x:"Ca. 18 km samlet",km:18,intensity:"Ugens primære kvalitetspas",focus:"Det konkrete Tanges-program opdateres, når det er kendt."},
   {d:3,s:"Hvile",x:"",rest:true,km:0},

   {d:6,s:"Langtur",x:"14 km · Roligt",km:14,intensity:"Puls · Z2 · RPE 2–3",focus:"Reduceret langtur. Målet er at afslutte blokken frisk nok til at bygge videre."},

};
const names=["Søndag","Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag"];
const dayLabels=["Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag","Søndag"];
const weekKey=monday=>"mpl-"+monday.toISOString().slice(0,10);
function plannedWeek(monday){const w=weekNo(monday);const src=plansByWeek[w];return src?src.map(p=>({...p})):null}
function getPlan(monday){try{const saved=localStorage.getItem(weekKey(monday));if(saved)return JSON.parse(saved);const planned=plannedWeek(monday);return planned||[{d:1,s:"Ikke planlagt",x:"",rest:true,km:null},{d:2,s:"Ikke planlagt",x:"",rest:true,km:null},{d:3,s:"Ikke planlagt",x:"",rest:true,km:null},{d:4,s:"Ikke planlagt",x:"",rest:true,km:null},{d:5,s:"Ikke planlagt",x:"",rest:true,km:null},{d:6,s:"Ikke planlagt",x:"",rest:true,km:null},{d:0,s:"Ikke planlagt",x:"",rest:true,km:null}]}catch(e){return plannedWeek(monday)||[]}}
function savePlan(monday,plan){try{localStorage.setItem(weekKey(monday),JSON.stringify(plan))}catch(e){}}
function moveSession(monday,plan,from,to){if(from===to)return;const moving={...plan[from]};const target={...plan[to]};plan[to]=moving;plan[from]=target;savePlan(monday,plan);render()}
const now=new Date(), day=now.getDay(), diff=(day===0?-6:1-day), currentMonday=new Date(now); currentMonday.setHours(12,0,0,0); currentMonday.setDate(now.getDate()+diff); let weekOffset=0;
const weekNo=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil((((t-y)/86400000)+1)/7)};
const box=document.getElementById("days");
function render(){
 const monday=new Date(currentMonday);monday.setDate(currentMonday.getDate()+weekOffset*7);
 const plan=getPlan(monday);
 const known=plan.filter(p=>p.km!==null),complete=known.length===plan.length,total=known.reduce((sum,p)=>sum+(p.km||0),0);
 document.getElementById("total").innerHTML=complete?"<strong>"+total.toLocaleString("da-DK",{maximumFractionDigits:1})+" km</strong> planlagt":"Km planlægges";
 document.getElementById("week").textContent="Uge "+weekNo(monday);
 document.getElementById("heading").textContent=weekOffset===0?"Denne uge":weekOffset===1?"Næste uge":weekOffset===-1?"Forrige uge":"Uge "+weekNo(monday);
 box.innerHTML="";
 plan.forEach((p,i)=>{
  const dt=new Date(monday);dt.setDate(monday.getDate()+i);const isToday=dt.toDateString()===now.toDateString();
  const hasInfo=!p.rest;
  const el=document.createElement("article");el.className="day"+(isToday?" today":"")+(p.rest?" rest":"")+(hasInfo?" hasinfo":"");
  const summary=p.km!=null&&p.km>0?(p.km+" km"):(p.x||"");
  const focus=p.focus||(!p.rest?"Fokus og beskrivelse tilføjes, når den konkrete træning planlægges.":"");const intensity=p.intensity||"";
  const options=dayLabels.map((n,j)=>'<option value="'+j+'"'+(j===i?' selected':'')+'>'+n+'</option>').join("");
  el.innerHTML='<div><div class="name">'+names[dt.getDay()]+'</div><div class="date">'+dt.toLocaleDateString("da-DK",{day:"numeric",month:"short"})+'</div></div><div><div class="session">'+p.s+(isToday?'<span class="badge">I dag</span>':'')+'</div>'+(summary?'<div class="detail">'+summary+'</div>':'')+(intensity?'<div class="intensityPreview">'+intensity+'</div>':'')+'</div>'+(hasInfo?'<div class="expand"><div class="focus"><strong>Fokus</strong><br>'+focus+'<div class="moveRow"><span class="moveLabel">Flyt til</span><select class="moveSelect">'+options+'</select></div></div></div>':'');
  if(hasInfo){el.addEventListener("click",e=>{if(e.target.tagName!=="SELECT"&&e.target.tagName!=="OPTION")el.classList.toggle("open")});const sel=el.querySelector(".moveSelect");sel.addEventListener("change",e=>{e.stopPropagation();moveSession(monday,plan,i,Number(e.target.value))})}
  box.appendChild(el)
 })
}
document.getElementById("refresh").onclick=()=>{const u=new URL(window.location.href);u.searchParams.set("_",Date.now());window.location.replace(u.toString())};
document.getElementById("prev").onclick=()=>{weekOffset--;render()};
document.getElementById("next").onclick=()=>{weekOffset++;render()};
render();
</script>
</body>
</html>
