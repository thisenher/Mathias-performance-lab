<!doctype html>
<html lang="da">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<title>Mathias · Løbeplan</title>
<style>
:root{--bg:#f3f2ef;--card:rgba(255,255,255,.88);--text:#161616;--muted:#77736c;--line:rgba(30,28,24,.09);--accent:#171717;--shadow:0 10px 35px rgba(24,22,18,.045)}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% -120px,#fff 0,#f7f6f3 34%,var(--bg) 72%);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
main{width:min(680px,100%);margin:auto;padding:42px 18px 64px}
header{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px;padding:0 2px}
.eyebrow{font-size:11px;font-weight:750;letter-spacing:.16em;text-transform:uppercase;color:#8c877f}
h1{font-size:32px;line-height:1.02;margin:9px 0 0;letter-spacing:-.045em;font-weight:760}
.total{font-size:12px;color:var(--muted);margin-top:10px;letter-spacing:.01em}.total strong{color:var(--text);font-weight:750}.week{font-size:13px;color:var(--muted);min-width:58px;text-align:center}.weeknav{display:flex;align-items:center;gap:7px;padding-bottom:1px}.weeknav button{width:34px;height:34px;border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:11px;font-size:21px;line-height:1;color:var(--text);cursor:pointer;box-shadow:0 4px 15px rgba(24,22,18,.035);backdrop-filter:blur(8px);transition:transform .15s ease,background .15s ease}.weeknav button:hover{background:#fff}.weeknav button:active{transform:scale(.96)}
.days{display:grid;gap:11px}
.day{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 19px;display:grid;grid-template-columns:82px 1fr;gap:14px;min-height:80px;box-shadow:var(--shadow);backdrop-filter:blur(10px);transition:transform .15s ease,box-shadow .15s ease}
.day.today{border:1px solid rgba(20,20,20,.32);padding:18px 19px;box-shadow:0 12px 38px rgba(24,22,18,.08),inset 3px 0 0 #171717}
.date{font-size:11px;color:#99948d;margin-top:5px}.name{font-size:12px;font-weight:780;letter-spacing:.09em;text-transform:uppercase}
.session{font-size:18px;font-weight:730;letter-spacing:-.025em}.detail{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
.rest .session{color:#9a9a96;font-weight:600}
.badge{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:#171717;color:white;border-radius:99px;padding:4px 8px;margin-left:7px;vertical-align:2px}
footer{font-size:11px;color:#aaa59e;margin-top:26px;text-align:center;letter-spacing:.02em}
@media(max-width:430px){main{padding:30px 14px 48px}h1{font-size:29px}.day{grid-template-columns:72px 1fr;padding:16px}.day.today{padding:16px}.session{font-size:17px}}
</style>
</head>
<body>
<main>
<header><div><div class="eyebrow">Mathias · Løbeplan</div><h1 id="heading">Denne uge</h1><div class="total" id="total"></div></div><div class="weeknav"><button id="prev" aria-label="Forrige uge">‹</button><div class="week" id="week"></div><button id="next" aria-label="Næste uge">›</button></div></header>
<section class="days" id="days"></section>
<footer>Planen opdateres løbende.</footer>
</main>
<script>
const plan=[
 {d:1,s:"Easy",x:"Plan tilføjes senere",km:null},
 {d:2,s:"TANGES",x:"",km:null},
 {d:3,s:"Hvile",x:"",rest:true,km:0},
 {d:4,s:"Easy",x:"Plan tilføjes senere",km:null},
 {d:5,s:"Easy",x:"Plan tilføjes senere",km:null},
 {d:6,s:"Langtur",x:"Plan tilføjes senere",km:null},
 {d:0,s:"Hvile",x:"",rest:true,km:0}
];
const names=["Søndag","Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag"];
const now=new Date(), day=now.getDay(), diff=(day===0?-6:1-day), currentMonday=new Date(now); currentMonday.setHours(12,0,0,0); currentMonday.setDate(now.getDate()+diff); let weekOffset=0;
const weekNo=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil((((t-y)/86400000)+1)/7)};
const box=document.getElementById("days");
function render(){const known=plan.filter(p=>p.km!==null);const complete=known.length===plan.length;const total=known.reduce((sum,p)=>sum+(p.km||0),0);document.getElementById("total").innerHTML=complete?"<strong>"+total.toLocaleString("da-DK",{maximumFractionDigits:1})+" km</strong> planlagt":"Km planlægges";const monday=new Date(currentMonday);monday.setDate(currentMonday.getDate()+weekOffset*7);document.getElementById("week").textContent="Uge "+weekNo(monday);document.getElementById("heading").textContent=weekOffset===0?"Denne uge":weekOffset===1?"Næste uge":weekOffset===-1?"Forrige uge":"Uge "+weekNo(monday);box.innerHTML="";plan.forEach((p,i)=>{const dt=new Date(monday);dt.setDate(monday.getDate()+i);const isToday=dt.toDateString()===now.toDateString();const el=document.createElement("article");el.className="day"+(isToday?" today":"")+(p.rest?" rest":"");el.innerHTML='<div><div class="name">'+names[dt.getDay()]+'</div><div class="date">'+dt.toLocaleDateString("da-DK",{day:"numeric",month:"short"})+'</div></div><div><div class="session">'+p.s+(isToday?'<span class="badge">I dag</span>':'')+'</div>'+(p.x?'<div class="detail">'+p.x+'</div>':'')+'</div>';box.appendChild(el)})}document.getElementById("prev").onclick=()=>{weekOffset--;render()};document.getElementById("next").onclick=()=>{weekOffset++;render()};render();
</script>
</body>
</html>
