<!doctype html>
<html lang="da">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<title>Mathias · Løbeplan</title>
<style>
:root{--bg:#f5f4f1;--card:#fff;--text:#111;--muted:#99958f;--line:rgba(25,22,18,.075);--shadow:0 7px 22px rgba(30,25,18,.045);--green:#159b57;--greenbg:#edf8f0;--orange:#f29a32;--orangebg:#fff4e8;--purple:#7463df;--purplebg:#f2efff;--grey:#617889;--greybg:#f0f4f6}
*{box-sizing:border-box}html,body{touch-action:manipulation}body{margin:0;background:linear-gradient(#fbfaf8,var(--bg));color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
main{width:min(680px,100%);margin:auto;padding:34px 18px 58px}
header{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px;padding:0 3px}
.eyebrow{font-size:11px;font-weight:780;letter-spacing:.17em;text-transform:uppercase;color:#8f8a82}
h1{font-size:35px;line-height:1;margin:9px 0 0;letter-spacing:-.05em;font-weight:800}
.total{font-size:13px;color:var(--muted);margin-top:9px}.total strong{color:var(--text);font-weight:800}
.weeknav{display:flex;align-items:center;gap:8px;padding-bottom:1px}.week{font-size:13px;color:var(--muted);min-width:48px;text-align:center}
.weeknav button{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:22px;line-height:1;color:var(--text);cursor:pointer;box-shadow:0 5px 16px rgba(24,22,18,.05);transition:transform .15s ease}.weeknav .refresh{font-size:19px;margin-right:2px}.weeknav button:active{transform:scale(.95)}
.days{display:grid;gap:9px}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 13px;display:grid;grid-template-columns:68px 54px minmax(0,1fr) 18px;gap:11px;align-items:center;min-height:78px;box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease}
.day.today{border-color:rgba(20,20,20,.25);box-shadow:0 8px 26px rgba(24,22,18,.075),inset 3px 0 0 #171717}
.day.hasinfo{cursor:pointer}.day:active{transform:scale(.995)}
.dayDate{align-self:center}.name{font-size:12px;font-weight:830;letter-spacing:.09em;text-transform:uppercase}.date{font-size:11px;color:#aaa69f;margin-top:6px}
.iconbox{width:54px;height:54px;border-radius:13px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.iconbox.easy{background:var(--greenbg);color:var(--green)}.iconbox.quality{background:var(--orangebg);color:var(--orange)}.iconbox.long{background:var(--purplebg);color:var(--purple)}.iconbox.rest{background:var(--greybg);color:var(--grey)}
.runicon{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.resticon{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.longicon{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tangesMark{width:48px;height:44px;position:relative;display:flex;align-items:center;justify-content:center}.tangesHook{position:absolute;width:27px;height:34px;border:5px solid #111;border-top-color:transparent;border-right-color:transparent;border-radius:50%;transform:rotate(-28deg);top:4px;left:13px}.tangesHook:after{content:"";position:absolute;width:19px;height:5px;background:#111;border-radius:5px;transform:rotate(-24deg);top:-5px;left:13px}.tangesText{position:relative;z-index:2;font-size:10px;font-weight:950;font-style:italic;letter-spacing:-.08em;color:#f0d73b;text-shadow:0 0 .2px #a88f00;transform:translateY(1px)}
.work{min-width:0}.km{font-size:17px;font-weight:800;letter-spacing:-.025em;line-height:1.05}.session{font-size:14px;font-weight:760;margin-top:3px;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.intensityPreview{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{font-size:23px;font-weight:350;color:#171717;line-height:1;transition:transform .2s ease}.day.open .chev{transform:rotate(90deg)}
.expand{grid-column:3/5;max-height:0;overflow:hidden;opacity:0;transition:max-height .25s ease,opacity .2s ease,margin .2s ease}.day.open .expand{max-height:250px;opacity:1;margin-top:2px}
.focus{font-size:12px;line-height:1.55;color:#77736c;padding:11px 2px 2px;border-top:1px solid var(--line)}.focus strong{color:var(--text)}
.moveRow{display:flex;align-items:center;gap:8px;margin-top:10px}.moveLabel{font-size:11px;color:#aaa69f}.moveSelect{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;font:inherit;font-size:12px;color:var(--text)}
.badge{display:inline-block;font-size:9px;letter-spacing:.06em;text-transform:uppercase;background:#171717;color:#fff;border-radius:99px;padding:3px 6px;margin-left:6px;vertical-align:2px}
footer{font-size:11px;color:#aaa59e;margin-top:24px;text-align:center}
@media(max-width:430px){main{padding:29px 13px 46px}h1{font-size:32px}header{margin-bottom:21px}.weeknav{gap:6px}.weeknav button{width:36px;height:36px}.week{min-width:43px}.day{grid-template-columns:62px 50px minmax(0,1fr) 15px;gap:9px;padding:11px 12px;min-height:74px;border-radius:15px}.iconbox{width:50px;height:50px;border-radius:12px}.km{font-size:16px}.session{font-size:13.5px}.intensityPreview{font-size:10.5px}}
</style>
</head>
<body>
<main>
<header><div><div class="eyebrow">Mathias · Løbeplan</div><h1 id="heading">Denne uge</h1><div class="total" id="total"></div></div><div class="weeknav"><button id="refresh" class="refresh" aria-label="Opdater siden" title="Opdater">↻</button><button id="prev" aria-label="Forrige uge">‹</button><div class="week" id="week"></div><button id="next" aria-label="Næste uge">›</button></div></header>
<section class="days" id="days"></section>
<footer>Planen opdateres løbende.</footer>
</main>
<script>
const plansByWeek={
  41:[
   {d:1,s:"Easy",x:"7 km",km:7,intensity:"Puls · Z2 · RPE 2–3",focus:"Rolig aerob volumen. Hold indsatsen behagelig hele vejen. Målet er at starte ugen med friske ben til Tanges tirsdag."},
   {d:2,s:"TANGES",x:"6 × 6 min tærskel · p. 90 sek.",km:18,intensity:"Tærskel · 90 sek. pause",focus:"6 × 6 min tærskel med 90 sek. pause. Start kontrolleret og lad farten finde sit niveau — målet er seks stabile reps, ikke at presse de første for hårdt. Ugens primære kvalitetspas."},
   {d:3,s:"Hvile",x:"",rest:true,km:0},
   {d:4,s:"Easy + strides",x:"8 km · 4 × 20 sek.",km:8,intensity:"Z2 · RPE 2–3 · strides hurtigt men afslappet",focus:"Rolig aerob tur efterfulgt af 4 × 20 sek. strides med god pause. Fokus på rytme og løbeøkonomi — ikke sprint."},
   {d:5,s:"Recovery",x:"5 km · Meget let",km:5,intensity:"RPE 1–2 · meget let",focus:"Ren restitution og ekstra volumen. Tempoet er underordnet. Turen skal efterlade benene bedre end før."},
   {d:6,s:"Langtur",x:"12 km · Roligt",km:12,intensity:"Puls · Z2 · RPE 2–3",focus:"Rolig løbespecifik udholdenhed. Ingen progression eller fast finish. Du skal føle, at du kunne have fortsat."},
   {d:0,s:"Hvile",x:"",rest:true,km:0}
  ],
  42:[
   {d:1,s:"Easy",x:"8 km",km:8,intensity:"Puls · Z2 · RPE 2–3",focus:"Rolig aerob volumen. Kontrolleret hele vejen og ingen pacejagt."},
   {d:2,s:"TANGES",x:"Ca. 18 km samlet",km:18,intensity:"Ugens primære kvalitetspas",focus:"Det konkrete Tanges-program opdateres, når det er kendt."},
   {d:3,s:"Hvile",x:"",rest:true,km:0},
   {d:4,s:"Easy + strides",x:"9 km · 6 × 20 sek.",km:9,intensity:"Z2 · RPE 2–3 · strides på følelse",focus:"Aerob volumen med 6 afslappede strides til sidst. Hurtigt og teknisk pænt, aldrig sprint."},
   {d:5,s:"Recovery",x:"5 km · Meget let",km:5,intensity:"RPE 1–2 · meget let",focus:"Kort restitutionsløb før langturen."},
   {d:6,s:"Langtur",x:"14 km · Roligt",km:14,intensity:"Puls · Z2 · RPE 2–3",focus:"Første forlængelse af langturen. Stabil easy-indsats hele vejen."},
   {d:0,s:"Hvile",x:"",rest:true,km:0}
  ],
  43:[
   {d:1,s:"Easy",x:"8 km",km:8,intensity:"Puls · Z2 · RPE 2–3",focus:"Rolig aerob volumen og friskhed til tirsdag."},
   {d:2,s:"TANGES",x:"Ca. 18 km samlet",km:18,intensity:"Ugens primære kvalitetspas",focus:"Det konkrete Tanges-program opdateres, når det er kendt."},
   {d:3,s:"Hvile",x:"",rest:true,km:0},
   {d:4,s:"Easy",x:"10 km",km:10,intensity:"Puls · Z2 · RPE 2–3",focus:"Blokkens første lidt større easy-tur. Formålet er billige aerobe kilometer uden ekstra intensitet."},
   {d:5,s:"Recovery",x:"6 km · Meget let",km:6,intensity:"RPE 1–2 · meget let",focus:"Let løb og frekvens. Spar benene til lørdag."},
   {d:6,s:"Langtur",x:"15 km · Roligt",km:15,intensity:"Puls · Z2 · RPE 2–3",focus:"Durability uden tempoarbejde. Stabil, rolig indsats fra første til sidste kilometer."},
   {d:0,s:"Hvile",x:"",rest:true,km:0}
  ],
  44:[
   {d:1,s:"Easy",x:"7 km",km:7,intensity:"Puls · Z2 · RPE 2–3",focus:"Lettere uge. Bevar rytmen, men sænk den samlede mekaniske belastning."},
   {d:2,s:"TANGES",x:"Ca. 17 km samlet",km:17,intensity:"Ugens primære kvalitetspas",focus:"Tanges fortsætter som kvalitet, men resten af ugen er reduceret for at absorbere de første tre uger."},
   {d:3,s:"Hvile",x:"",rest:true,km:0},
   {d:4,s:"Easy + strides",x:"8 km · 4 × 20 sek.",km:8,intensity:"Z2 · RPE 2–3 · strides afslappet",focus:"Rolig tur med få strides for at bevare lidt fart og rytme uden stor belastning."},
   {d:5,s:"Recovery",x:"5 km · Meget let",km:5,intensity:"RPE 1–2 · meget let",focus:"Let restitution."},
   {d:6,s:"Langtur",x:"12 km · Roligt",km:12,intensity:"Puls · Z2 · RPE 2–3",focus:"Reduceret langtur i absorptionsugen. Ingen grund til at skabe ekstra træthed."},
   {d:0,s:"Hvile",x:"",rest:true,km:0}
  ],
  45:[
   {d:1,s:"Easy",x:"8 km",km:8,intensity:"Puls · Z2 · RPE 2–3",focus:"Tilbage til normal volumen efter absorptionsugen."},
   {d:2,s:"TANGES",x:"Ca. 18 km samlet",km:18,intensity:"Ugens primære kvalitetspas",focus:"Det konkrete Tanges-program opdateres, når det er kendt."},
   {d:3,s:"Hvile",x:"",rest:true,km:0},
   {d:4,s:"Easy + strides",x:"10 km · 6 × 20 sek.",km:10,intensity:"Z2 · RPE 2–3 · strides på følelse",focus:"Solid aerob tur med afslappede strides. Målet er volumen plus neuromuskulær fart uden et ekstra hårdt pas."},
   {d:5,s:"Recovery",x:"6 km · Meget let",km:6,intensity:"RPE 1–2 · meget let",focus:"Kort og meget roligt før langturen."},
   {d:6,s:"Langtur",x:"15 km · Roligt",km:15,intensity:"Puls · Z2 · RPE 2–3",focus:"Nu skal 15 km begynde at føles som en normal, ukompliceret langtur."},
   {d:0,s:"Hvile",x:"",rest:true,km:0}
  ],
  46:[
   {d:1,s:"Easy",x:"8 km",km:8,intensity:"Puls · Z2 · RPE 2–3",focus:"Kontrolleret aerob volumen før Tanges."},
   {d:2,s:"TANGES",x:"Ca. 18 km samlet",km:18,intensity:"Ugens primære kvalitetspas",focus:"Det konkrete Tanges-program opdateres, når det er kendt."},
   {d:3,s:"Hvile",x:"",rest:true,km:0},
   {d:4,s:"Easy + strides",x:"10 km · 6 × 20 sek.",km:10,intensity:"Z2 · RPE 2–3 · strides afslappet",focus:"Aerob volumen og korte, kontrollerede strides."},
   {d:5,s:"Recovery",x:"6 km · Meget let",km:6,intensity:"RPE 1–2 · meget let",focus:"Hold igen. Lørdag er ugens sekundære belastning."},
   {d:6,s:"Langtur",x:"17 km · Roligt",km:17,intensity:"Puls · Z2 · RPE 2–3",focus:"Vigtig durability-tur. Hele turen easy; stimulussen er varigheden, ikke farten."},
   {d:0,s:"Hvile",x:"",rest:true,km:0}
  ],
  47:[
   {d:1,s:"Easy",x:"8 km",km:8,intensity:"Puls · Z2 · RPE 2–3",focus:"Rolig start på blokkens største planlagte uge."},
   {d:2,s:"TANGES",x:"Ca. 18 km samlet",km:18,intensity:"Ugens primære kvalitetspas",focus:"Det konkrete Tanges-program opdateres, når det er kendt. Ingen ekstra kvalitet lægges oveni bare fordi volumen er høj."},
   {d:3,s:"Hvile",x:"",rest:true,km:0},
   {d:4,s:"Easy + strides",x:"11 km · 6 × 20 sek.",km:11,intensity:"Z2 · RPE 2–3 · strides afslappet",focus:"Blokkens største easy-tur. Stadig let; volumen er stimulussen."},
   {d:5,s:"Recovery",x:"6 km · Meget let",km:6,intensity:"RPE 1–2 · meget let",focus:"Meget let løb før blokkens længste langtur."},
   {d:6,s:"Langtur",x:"18 km · Roligt",km:18,intensity:"Puls · Z2 · RPE 2–3",focus:"Blokkens længste langtur. Ingen fast finish eller progression. Målet er at absorbere en stor uge, ikke skabe en hero-session."},
   {d:0,s:"Hvile",x:"",rest:true,km:0}
  ],
  48:[
   {d:1,s:"Easy",x:"7 km",km:7,intensity:"Puls · Z2 · RPE 2–3",focus:"Absorptionsuge efter blokkens største belastning."},
   {d:2,s:"TANGES",x:"Ca. 17 km samlet",km:17,intensity:"Ugens primære kvalitetspas",focus:"Tanges bevarer kvaliteten, mens den øvrige volumen reduceres."},
   {d:3,s:"Hvile",x:"",rest:true,km:0},
   {d:4,s:"Easy + strides",x:"9 km · 4 × 20 sek.",km:9,intensity:"Z2 · RPE 2–3 · strides afslappet",focus:"Rolig aerob tur med få strides for at holde rytmen."},
   {d:5,s:"Recovery",x:"5 km · Meget let",km:5,intensity:"RPE 1–2 · meget let",focus:"Kort restitution."},
   {d:6,s:"Langtur",x:"14 km · Roligt",km:14,intensity:"Puls · Z2 · RPE 2–3",focus:"Reduceret langtur. Målet er at afslutte blokken frisk nok til at bygge videre."},
   {d:0,s:"Hvile",x:"",rest:true,km:0}
  ]
};
const names=["SØN","MAN","TIR","ONS","TOR","FRE","LØR"];
const dayLabels=["Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag","Søndag"];
const weekKey=monday=>"mpl-"+monday.toISOString().slice(0,10);
function plannedWeek(monday){const w=weekNo(monday);const src=plansByWeek[w];return src?src.map(p=>({...p})):null}
function getPlan(monday){try{const saved=localStorage.getItem(weekKey(monday));if(saved)return JSON.parse(saved);const planned=plannedWeek(monday);return planned||[{d:1,s:"Ikke planlagt",x:"",rest:true,km:null},{d:2,s:"Ikke planlagt",x:"",rest:true,km:null},{d:3,s:"Ikke planlagt",x:"",rest:true,km:null},{d:4,s:"Ikke planlagt",x:"",rest:true,km:null},{d:5,s:"Ikke planlagt",x:"",rest:true,km:null},{d:6,s:"Ikke planlagt",x:"",rest:true,km:null},{d:0,s:"Ikke planlagt",x:"",rest:true,km:null}]}catch(e){return plannedWeek(monday)||[]}}
function savePlan(monday,plan){try{localStorage.setItem(weekKey(monday),JSON.stringify(plan))}catch(e){}}
function moveSession(monday,plan,from,to){if(from===to)return;const moving={...plan[from]};const target={...plan[to]};plan[to]=moving;plan[from]=target;savePlan(monday,plan);render()}
const now=new Date(), day=now.getDay(), diff=(day===0?-6:1-day), currentMonday=new Date(now); currentMonday.setHours(12,0,0,0); currentMonday.setDate(now.getDate()+diff); let weekOffset=0;
const weekNo=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil((((t-y)/86400000)+1)/7)};
const box=document.getElementById("days");
function iconFor(p){
 if(p.rest)return '<div class="iconbox rest"><svg class="resticon" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 7v19M5 20h22v6M9 20V10h7c3 0 5 2 5 5v5M9 14h12"/></svg></div>';
 if(p.s==="TANGES")return '<div class="iconbox quality"><div class="tangesMark"><span class="tangesHook"></span><span class="tangesText">TANGES</span></div></div>';
 if(p.s==="Langtur")return '<div class="iconbox long"><svg class="longicon" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 6c3-4 8-2 8 2 0 3-3 5-8 8-5-3-8-5-8-8 0-4 5-6 8-2Z"/><path d="M16 26c-3 4-8 2-8-2 0-3 3-5 8-8 5 3 8 5 8 8 0 4-5 6-8 2Z"/></svg></div>';
 return '<div class="iconbox easy"><svg class="runicon" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 21c4 0 7-3 9-9l4 4 5 1 4 4c2 2 0 5-3 5H11c-4 0-6-2-6-5Z"/><path d="M14 12l-2-4M18 16l4-4M7 21h19M11 25h14"/></svg></div>';
}
function render(){
 const monday=new Date(currentMonday);monday.setDate(currentMonday.getDate()+weekOffset*7);
 const plan=getPlan(monday);
 const known=plan.filter(p=>p.km!==null),complete=known.length===plan.length,total=known.reduce((sum,p)=>sum+(p.km||0),0);
 document.getElementById("total").innerHTML=complete?"<strong>"+total.toLocaleString("da-DK",{maximumFractionDigits:1})+" km</strong> planlagt":"Km planlægges";
 document.getElementById("week").textContent="Uge "+weekNo(monday);
 document.getElementById("heading").textContent="Uge "+weekNo(monday);
 box.innerHTML="";
 plan.forEach((p,i)=>{
  const dt=new Date(monday);dt.setDate(monday.getDate()+i);const isToday=dt.toDateString()===now.toDateString();
  const hasInfo=!p.rest;
  const focus=p.focus||(!p.rest?"Fokus og beskrivelse tilføjes, når den konkrete træning planlægges.":"");
  const intensity=p.intensity||"";
  const options=dayLabels.map((n,j)=>'<option value="'+j+'"'+(j===i?' selected':'')+'>'+["Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag","Søndag"][j]+'</option>').join("");
  const el=document.createElement("article");el.className="day"+(isToday?" today":"")+(p.rest?" rest":"")+(hasInfo?" hasinfo":"");
  const km=p.km!=null&&p.km>0?p.km+" km":"";
  const sub=p.rest?"Restitution":intensity;
  el.innerHTML='<div class="dayDate"><div class="name">'+names[dt.getDay()]+'</div><div class="date">'+dt.toLocaleDateString("da-DK",{day:"numeric",month:"short"})+'</div></div>'+iconFor(p)+'<div class="work">'+(km?'<div class="km">'+km+'</div>':'')+'<div class="session">'+p.s+(isToday?'<span class="badge">I dag</span>':'')+'</div>'+(sub?'<div class="intensityPreview">'+sub+'</div>':'')+'</div><div class="chev">'+(hasInfo?'›':'')+'</div>'+(hasInfo?'<div class="expand"><div class="focus"><strong>Fokus</strong><br>'+focus+'<div class="moveRow"><span class="moveLabel">Flyt til</span><select class="moveSelect">'+options+'</select></div></div></div>':'');
  if(hasInfo){el.addEventListener("click",e=>{if(e.target.tagName!=="SELECT"&&e.target.tagName!=="OPTION")el.classList.toggle("open")});const sel=el.querySelector(".moveSelect");sel.addEventListener("change",e=>{e.stopPropagation();moveSession(monday,plan,i,Number(e.target.value))})}
  box.appendChild(el)
 })
}
document.getElementById("refresh").onclick=()=>{const u=new URL(window.location.href);u.searchParams.set("_",Date.now());window.location.replace(u.toString())};
document.getElementById("prev").onclick=()=>{weekOffset--;render()};
document.getElementById("next").onclick=()=>{weekOffset++;render()};
render();
</script>
</body>
</html>
